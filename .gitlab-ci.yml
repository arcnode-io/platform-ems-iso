stages:
  - check
  - mirror

lint:
  stage: check
  image: python:3.13-slim
  script:
    - pip install --quiet --break-system-packages ansible-core ansible-lint yamllint
    - ansible-galaxy collection install ansible/collections/*.tar.gz
    - yamllint ansible/ cfg.yml
    - ansible-lint ansible/site.yml
    - ansible-playbook --syntax-check ansible/site.yml

shell:
  stage: check
  script:
    - docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable install/postinstall.sh install/provision.sh tools/bundle-images.sh tools/factory-reset.sh

compose:
  stage: check
  image: docker:27-cli
  script:
    # Render + validate the compose the appliance actually ships. Needs a .env
    # present for ${VAR} interpolation (empty values are fine for a structural
    # config check).
    - mkdir -p /tmp/cv
    - sed 's/{{ http_port | default(80) }}/80/' ansible/roles/stack/templates/compose.yml.j2 > /tmp/cv/compose.yml
    - ': > /tmp/cv/.env'
    - docker compose -f /tmp/cv/compose.yml config >/dev/null

mirror:
  stage: mirror
  variables:
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/platform-ems-iso.git
  only:
    - main
