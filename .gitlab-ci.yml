stages:
  - check
  - mirror

check:
  stage: check
  script:
    - docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable install/postinstall.sh install/provision.sh
    - pip install --quiet ansible-core
    - ansible-galaxy collection install ansible/collections/*.tar.gz
    - ansible-playbook --syntax-check ansible/site.yml

mirror:
  stage: mirror
  variables:
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/platform-ems-iso.git
  only:
    - main
