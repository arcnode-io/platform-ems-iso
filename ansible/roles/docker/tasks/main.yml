# Ensure docker engine + compose plugin. When docker is already installed (from
# the ISO's baked debs, offline), skip the apt path entirely and just ensure the
# service runs. Online (bench) with no docker, install from Docker's apt repo.
- name: Docker already installed?
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_bin

- name: Docker apt prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present
    update_cache: true
  when: not docker_bin.stat.exists

- name: Keyrings dir
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: not docker_bin.stat.exists

- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: not docker_bin.stat.exists

- name: Docker apt repo
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable"
    filename: docker
    state: present
  when: not docker_bin.stat.exists

- name: Docker engine + compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true
  when: not docker_bin.stat.exists

- name: Docker running + enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
