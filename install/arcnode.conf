# Hetzner installimage autosetup config — stock Debian 12 (bookworm).
# Two NVMe → software RAID1. Hostname arcnode. Nothing custom in the OS.
DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 1
HOSTNAME arcnode
BOOTLOADER grub
PART /boot ext3 1024M
PART swap  swap 8G
PART /     ext4 all
IMAGE /root/images/Debian-1214-bookworm-amd64-base.tar.zst
