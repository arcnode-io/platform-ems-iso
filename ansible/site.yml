# ARCNODE appliance convergence. Runs ON the box (connection: local) — no
# control node, so it keeps working behind the customer firewall. systemd
# re-runs it every boot; re-running is idempotent by design.
- name: Converge the ARCNODE appliance
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - /opt/arcnode/cfg.yml
  vars:
    stack_dir: /opt/arcnode/stack
  tasks:
    - name: Docker apt prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        state: present
        update_cache: true

    - name: Keyrings dir
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker apt repo
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable"
        filename: docker
        state: present

    - name: Docker engine + compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Docker running + enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Stack dir
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: directory
        mode: "0755"

    - name: Render greeter page (proves cfg.yml drives the stack)
      ansible.builtin.copy:
        content: "{{ greeting }}\n"
        dest: "{{ stack_dir }}/index.html"
        mode: "0644"

    - name: Render compose
      ansible.builtin.template:
        src: /opt/arcnode/ansible/compose.yml.j2
        dest: "{{ stack_dir }}/compose.yml"
        mode: "0644"

    - name: Bring up the stack
      community.docker.docker_compose_v2:
        project_src: "{{ stack_dir }}"
        state: present
