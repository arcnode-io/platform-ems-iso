stages:
  - check
  - publish
  - mirror

# Why GIT_STRATEGY=clone everywhere: publish runs `sudo lb build` which
# leaves root-owned files in chroot/, binary/, config/hooks/normal/, etc.
# `git fetch`'s untracked-file cleanup can't remove them as gitlab-runner,
# so a fetch-strategy pipeline dies in checks before any user script gets
# to chown them back. A fresh clone sidesteps the entire problem; ~5-10s
# overhead. publish also after_scripts a chown for tidiness.
variables:
  GIT_STRATEGY: clone

checks:
  stage: check
  script:
    - uv run poe checks
    - uv run pytest --junitxml=junit.xml
    - uv run poe cover
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

publish:
  stage: publish
  after_script:
    - sudo chown -R gitlab-runner:gitlab-runner . 2>/dev/null || true
  script:
    # Populate includes.chroot — appliance/* lands at well-known paths
    - mkdir -p live-build/config/includes.chroot/etc/systemd/system
    - cp appliance/systemd/*.service live-build/config/includes.chroot/etc/systemd/system/
    - mkdir -p live-build/config/includes.chroot/etc/arcnode/compose
    - cp appliance/compose/* live-build/config/includes.chroot/etc/arcnode/compose/
    - mkdir -p live-build/config/includes.chroot/etc/arcnode
    - cp live-build/config/install.json.reference live-build/config/includes.chroot/etc/arcnode/install.json
    - mkdir -p live-build/config/includes.chroot/opt/arcnode/wizard
    - cp -r src pyproject.toml uv.lock cfg.yml live-build/config/includes.chroot/opt/arcnode/wizard/
    # Build
    - cd live-build
    - sudo lb clean --purge
    - sudo lb config
    - sudo lb build
    - cd ..
    - ISO=$(ls live-build/arcnode-ems-*.iso | head -1)
    - test -n "$ISO" || (echo "no ISO produced"; exit 1)
    # Boot the ISO in qemu, drive the wizard via HTTP. Fails the job if
    # the wizard doesn't answer, blocking the S3 upload below — broken
    # ISOs never publish.
    - ARCNODE_ISO_PATH="$ISO" uv run pytest tests/test_iso_boot.py -vv
    # Upload to deterministic S3 key per commit + a stable "latest" alias.
    - aws s3 cp "$ISO" "s3://arcnode-public/iso/reference/arcnode-ems-${CI_COMMIT_SHORT_SHA}.iso"
    - aws s3 cp "$ISO" "s3://arcnode-public/iso/reference/arcnode-ems-latest.iso"
  only:
    - main

mirror:
  stage: mirror
  variables:
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/platform-ems-iso.git
  only:
    - main
