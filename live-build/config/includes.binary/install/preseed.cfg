# d-i preseed for the ARCNODE appliance install path.
# Drives debian-installer into live-installer mode (copy the live squashfs
# to disk) and skips questions that don't apply to a single-purpose appliance.
# Operator still answers: disk to install on, hostname, root password,
# timezone, and one user account.

# Enable live-installer mode — d-i will copy /run/live/medium/live/filesystem.squashfs
# to the target disk instead of debootstrapping a fresh system.
d-i live-installer/enable boolean true

# Don't bother with a network mirror — we're installing from the ISO.
d-i mirror/country string manual
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/security_host string

# tasksel: install nothing — the live squashfs has everything we need.
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

# Don't ask "should I install GRUB?" — yes, default disk, no fancy options.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

# Final reboot prompt: skip, just reboot.
d-i finish-install/reboot_in_progress note
