<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ARCNODE — First-boot Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; }
  body { font-family: system-ui, -apple-system, sans-serif; color: #fff; }
  #root { min-height: 100vh; }
</style>

<!-- WIRING: server inlines the baked install identity so the JSX has it at module-eval
     time — no fetch race with babel-standalone's auto-compile. -->
<script>
  window.INSTALL_IDENTITY = {{ identity | tojson }};
  window.HARDWARE_DATA = {{ hardware | tojson }};
</script>

<!-- Same React/babel CDN trio the designer used in setup-preview.html, same SRI hashes. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="/static/tokens.jsx"></script>
<!-- hardware-check.jsx exposes window.HardwareCheckBody — must load BEFORE
     setup.jsx which references it from the SetupWizardBody render tree. -->
<script type="text/babel" src="/static/hardware-check.jsx"></script>
<script type="text/babel" src="/static/setup.jsx"></script>

<script type="text/babel">
  // Mount the designer's SetupWizardBody against the SOVEREIGN theme.
  // tokens.jsx exposes window.SOVEREIGN; setup.jsx exposes window.SetupWizardBody.
  ReactDOM.createRoot(document.getElementById('root')).render(
    <window.SetupWizardBody t={window.SOVEREIGN}/>
  );
</script>
</body>
</html>
