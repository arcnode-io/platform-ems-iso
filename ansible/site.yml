# ARCNODE appliance convergence. Runs ON the box (connection: local) — no
# control node, so it converges behind the customer firewall. systemd
# (arcnode.service) re-runs it every boot; re-running is idempotent.
#
# Roles: harden OS → docker engine → generate secrets → render configs →
# bring up the stack. Each is independently ownable and stays <200 lines.
- name: Converge the ARCNODE appliance
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - /opt/arcnode/cfg.yml
  roles:
    - {role: base, tags: [base]}
    - {role: docker, tags: [docker]}
    - {role: secrets, tags: [secrets, stack]}
    - {role: config, tags: [config, stack]}
    - {role: tls, tags: [tls, stack]}
    - {role: stack, tags: [stack]}
    - {role: health, tags: [health, stack]}
