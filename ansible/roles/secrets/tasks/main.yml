# Generate ALL appliance credentials locally — no AWS Secrets Manager (airgap),
# no setup wizard. The password lookup persists each secret to /opt/arcnode/secrets
# on first generation and reads it back thereafter, so re-converge reuses the same
# values (idempotent — never rotates on every boot).
- name: Secrets dir (root-only)
  ansible.builtin.file:
    path: /opt/arcnode/secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Stack dir
  ansible.builtin.file:
    path: /opt/arcnode/stack
    state: directory
    mode: "0755"

# Generate-once, reuse-after. ascii_letters,digits only → safe in URLs + XML
# without escaping. 24 chars ~= 143 bits.
- name: Generate credentials
  ansible.builtin.set_fact:
    secrets_pg_ts_pw: "{{ lookup('password', '/opt/arcnode/secrets/pg_ts chars=ascii_letters,digits length=24') }}"
    secrets_pg_doc_pw: "{{ lookup('password', '/opt/arcnode/secrets/pg_doc chars=ascii_letters,digits length=24') }}"
    secrets_mqtt_gateway_pw: "{{ lookup('password', '/opt/arcnode/secrets/mqtt_gateway chars=ascii_letters,digits length=24') }}"
    secrets_mqtt_operator_pw: "{{ lookup('password', '/opt/arcnode/secrets/mqtt_operator chars=ascii_letters,digits length=24') }}"
    secrets_mqtt_viewer_pw: "{{ lookup('password', '/opt/arcnode/secrets/mqtt_viewer chars=ascii_letters,digits length=24') }}"
    secrets_mqtt_device_api_pw: "{{ lookup('password', '/opt/arcnode/secrets/mqtt_device_api chars=ascii_letters,digits length=24') }}"
    secrets_mqtt_telemetry_writer_pw: "{{ lookup('password', '/opt/arcnode/secrets/mqtt_telemetry_writer chars=ascii_letters,digits length=24') }}"
    secrets_auth_jwt_secret: "{{ lookup('password', '/opt/arcnode/secrets/auth_jwt chars=ascii_letters,digits length=48') }}"
    secrets_auth_operator_pw: "{{ lookup('password', '/opt/arcnode/secrets/auth_operator chars=ascii_letters,digits length=16') }}"
    secrets_auth_viewer_pw: "{{ lookup('password', '/opt/arcnode/secrets/auth_viewer chars=ascii_letters,digits length=16') }}"

# Compose reads .env from the project dir for ${VAR} interpolation. 0600, root.
- name: Render stack .env
  ansible.builtin.template:
    src: env.j2
    dest: /opt/arcnode/stack/.env
    owner: root
    group: root
    mode: "0600"

# HiveMQ File-RBAC store. Topic ACL is the exact working shape from platform-api
# CfnService (system_adr section 9); only the passwords vary.
- name: Render broker credentials.xml
  ansible.builtin.template:
    src: credentials.xml.j2
    dest: /opt/arcnode/stack/credentials.xml
    owner: root
    group: root
    mode: "0600"
