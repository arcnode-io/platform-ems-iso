[project]
name = "platform-ems-iso"
version = "1.0.0-beta"
requires-python = "==3.13.2"
dependencies = [
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",  # TLS cert/key upload (multipart form)
]

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.7.0",  # CVE-2026-44431, CVE-2026-44432
    "idna>=3.15",      # CVE-2026-45409 (transitive via httpx)
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "black[d]>=26.3.1",
    "poethepoet>=0.32.0",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
    "pip-audit>=2.6.1",
    "pytest-cov>=6.0.0",
    "deptry>=0.23.0",
    "pip>=26.1",  # CVE-2026-6357
    "ty>=0.0.18",
    "types-pyyaml>=6.0",
    "httpx>=0.28.1",
    "pexpect>=4.9.0",
]

[tool.poe.tasks]
# fastapi pulls starlette transitively but deptry sees both via the FastAPI
# umbrella; same for uvicorn/python-multipart entry-points used by fastapi.
# jinja2 used via fastapi.templating.Jinja2Templates — deptry doesn't follow.
# Tests in src/test_*.py import pytest (dev) — exclude them from the scan.
depcheck = "deptry . --per-rule-ignores DEP002=starlette|python-multipart|jinja2 --extend-exclude src/test_.* --extend-exclude appliance/.*"
format = "black ."
lint = "ruff check"
typecheck = "ty check"
# Skips: B101=assert (tests), B104=bind 0.0.0.0 (intentional — LAN appliance),
# B404/B603/B607=subprocess (intentional — wraps openssl + docker compose).
# Excludes src/test_* — pytest fixture passwords are test data, not creds.
audit-src = "bandit -r src/ -s B101,B104,B404,B603,B607 -x src/test_app.py,src/test_apply.py,src/test_identity.py,src/test_models.py"
# PYSEC-2025-183 (pyjwt — no fixed version) matches siblings.
audit-packages = "pip-audit --ignore-vuln GHSA-4xh5-x5gv-qwph --ignore-vuln GHSA-58qw-9mgm-455v --ignore-vuln PYSEC-2025-183"
security = ["audit-src", "audit-packages"]
checks = ["depcheck", "format", "lint", "typecheck", "security"]
unit = "pytest -vv src/*"
integration = "pytest -vv tests/*"
cover = "pytest -vv --cov"
review = "claude 'run code-reviewer agent against diff for quality and elegance'"
commit = "bash -c 'uv run poe checks && uv run poe cover && uv run poe review && git add -A && git cz && git push'"

[tool.coverage.run]
omit = ["*/test_*.py", "tests/*"]
