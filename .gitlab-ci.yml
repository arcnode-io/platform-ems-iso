stages:
  - check
  - publish
  - mirror

checks:
  stage: check
  script:
    - uv run poe checks
    - uv run pytest --junitxml=junit.xml
    - uv run poe cover
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Build the reference ISO + upload to S3. Same shape as docker repos —
# one artifact per main push, deterministic key, no per-customer state.
# Per-customer baking is platform-api's job (subprocess `lb build` against
# this same live-build dir, with the overlay swapped in), NOT a CI stage.
publish:
  stage: publish
  script:
    # includes.chroot is populated at commit time — appliance/systemd,
    # appliance/compose, src/ all already live there.
    - cd live-build
    - sudo lb clean --purge
    - sudo lb config
    - sudo lb build
    - cd ..
    - ISO=$(ls live-build/arcnode-ems-*.iso | head -1)
    - aws s3 cp "$ISO" "s3://arcnode-public/iso/reference/arcnode-ems-${CI_COMMIT_SHORT_SHA}.iso"
  only:
    - main

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/platform-ems-iso.git
  only:
    - main
