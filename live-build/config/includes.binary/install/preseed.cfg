# d-i preseed — fully unattended install of the live system to disk.
#
# Picks the FIRST disk it sees (/dev/vda in qemu, /dev/sda or /dev/nvme0n1
# on real hw), wipes it, copies the live squashfs over, installs grub.
# Operator who wants to choose disk/hostname/etc. picks "Install
# (interactive)" from the grub menu (which boots d-i without this
# preseed loaded).

# --- Locale + keyboard ---
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# --- Network ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string arcnode
d-i netcfg/get_domain string local

# --- No mirror — install from live squashfs only ---
d-i mirror/country string manual
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/security_host string

# --- Accounts ---
# Root: enabled with default password 'arcnode' (operator changes via
# wizard / first ssh login).
d-i passwd/root-login boolean true
d-i passwd/root-password password arcnode
d-i passwd/root-password-again password arcnode
# No regular user account — appliance is root-only.
d-i passwd/make-user boolean false

# --- Clock ---
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# --- Partition: wipe first disk, use atomic recipe (one big root + swap) ---
d-i partman/early_command string \
  USBDISK=$(list-devices usb-partition | sed 's|/[0-9]*$||' | head -1); \
  DISK=$(list-devices disk | grep -v "${USBDISK:-NONE}" | head -1); \
  debconf-set partman-auto/disk "$DISK"; \
  debconf-set grub-installer/bootdev "$DISK"
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Live install: copy live squashfs, don't fetch packages ---
d-i live-installer/enable boolean true
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

# --- GRUB ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

# --- Reboot when done ---
d-i finish-install/reboot_in_progress note
