stages:
  - check
  - mirror

lint:
  stage: check
  image: python:3.13-slim
  script:
    - pip install --quiet --break-system-packages ansible-core ansible-lint yamllint
    - ansible-galaxy collection install ansible/collections/*.tar.gz
    - yamllint ansible/ cfg.yml
    - ansible-lint ansible/site.yml
    - ansible-playbook --syntax-check ansible/site.yml

shell:
  stage: check
  script:
    - docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:stable install/postinstall.sh install/provision.sh tools/bundle-images.sh tools/factory-reset.sh

compose:
  stage: check
  image: docker:27-cli
  script:
    # Render + validate the compose the appliance actually ships. Needs a .env
    # present for ${VAR} interpolation (empty values are fine for a structural
    # config check).
    #
    # Reason: this project's runner is a shell executor, so `image:` above is
    # ignored and this script runs directly on the runner host's own
    # filesystem, not an isolated container — confirmed via a script_failure
    # that a same-commit retry (no code change) immediately passed. A fixed
    # path here (previously /tmp/cv) is a real shared, never-cleaned location
    # on that persistent host, not a fresh per-job temp dir; mktemp -d is the
    # actual fix, not a workaround — every run gets a genuinely new directory.
    - CV_DIR=$(mktemp -d)
    - sed 's/{{ http_port | default(80) }}/80/' ansible/roles/stack/templates/compose.yml.j2 > "$CV_DIR/compose.yml"
    - ": > \"$CV_DIR/.env\""
    - docker compose -f "$CV_DIR/compose.yml" config >/dev/null
    - rm -rf "$CV_DIR"

mirror:
  stage: mirror
  variables:
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/platform-ems-iso.git
  only:
    - main
