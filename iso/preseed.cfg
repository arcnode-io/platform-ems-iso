# ARCNODE appliance — unattended preseed for the OFFICIAL Debian 12 installer.
# We do NOT build a custom live system (that squashfs/live-installer machinery
# was the retired bug surface). Debian's own installer does the OS install; this
# file automates it and hands off to the Ansible appliance layer via late_command.

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network — DHCP, hostname arcnode
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string arcnode
d-i netcfg/get_domain string local
d-i netcfg/hostname string arcnode

### Mirror — none. Packages come from the DVD/ISO (offline appliance install).
d-i mirror/country string manual
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/security_host string

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC

### Accounts — root only (appliance). Operator rotates on first login.
d-i passwd/root-login boolean true
d-i passwd/root-password password arcnode
d-i passwd/root-password-again password arcnode
d-i passwd/make-user boolean false

### Partitioning — whole first disk, guided single partition + swap.
# TODO(raid): the installimage flow uses RAID1 across both NVMe; software-RAID
# preseed is more involved — land single-disk first, add RAID1 recipe next.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/nvme0n1 /dev/sda
d-i partman/default_filesystem string ext4
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Base + packages (minimal; the stack runs in docker via ansible)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server rsync
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### First-boot handoff — copy the on-ISO appliance payload into /opt/arcnode and
### run the same bench bootstrap the installimage flow uses. First boot then
### self-converges offline from the bundled images. /cdrom is still mounted in
### /target during late_command.
d-i preseed/late_command string \
  cp -a /cdrom/arcnode /target/opt/arcnode-payload; \
  in-target /bin/sh -c 'cd /opt/arcnode-payload && bash install/provision.sh || true'

### Finish — no prompt, reboot.
d-i finish-install/reboot_in_progress note
