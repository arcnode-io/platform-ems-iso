# ISO variant prometheus config — same as cloud but with localhost
# targets for the systemd daemons that expose metrics endpoints.
# Operator extends as app services instrument /metrics.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host daemons reachable on localhost from the prometheus container's
  # perspective if `network_mode: host`. Otherwise use host.docker.internal
  # or the docker bridge gateway (commonly 172.17.0.1). Leaving these
  # commented until the daemons are confirmed wired with metrics ports:
  #
  # - job_name: postgres-timeseries
  #   static_configs:
  #     - targets: ["host.docker.internal:9187"]   # postgres_exporter
  # - job_name: neo4j
  #   static_configs:
  #     - targets: ["host.docker.internal:2004"]   # neo4j metrics
  # - job_name: ollama
  #   static_configs:
  #     - targets: ["host.docker.internal:11434"]
